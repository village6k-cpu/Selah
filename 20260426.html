.vA .gloss-item .term {

  font-size: 16px;
}

@media (min-width: 600px) {
  .vA .prac-item { grid-template-columns: 100px 1fr; gap: 20px; }
}

}
.vA .prac-title {
  font-weight: 700; font-size: 15.5px;

}

  font-size: 14px; line-height: 1.7; color: var(--ink-soft);

}

.vA .prayer {
  background: var(--accent);
  color: #f5f2ec;
  padding: 32px 28px 36px;

}
@media (min-width: 720px) {
  .vA .prayer { padding: 36px 36px 40px; margin: 24px -56px 0; }
}
.vA .prayer .label {
  font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;

  margin-bottom: 16px;
}
.vA .prayer p {
  font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  font-size: 16.5px; line-height: 1.65;

  text-justify: inter-character;
  margin: 0 0 12px;
  text-wrap: pretty;
}

.vA .read-item {
  list-style: none;
  padding: 18px 0;
  border-top: 1px solid var(--line-soft);
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  align-items: baseline;
}
@media (min-width: 600px) {
  .vA .read-item { grid-template-columns: 1fr 2.2fr; gap: 22px; }
}
.vA .read-author {
  font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  font-size: 12.5px;
  letter-spacing: 0.04em;
  color: var(--muted);
  font-style: italic;
}
.vA .read-work {
  font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;

}

}

  text-align: center;

}
.vA .closing q {
  font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  font-size: clamp(18px, 4.5vw, 22px);

  letter-spacing: -0.01em;
}
.vA .colophon { margin-top: 96px; padding-bottom: 48px; }
.vA .colophon-rule {
  width: 40px; height: 1px; background: var(--ink);

}
.vA .colophon-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
  max-width: 720px; margin: 0 auto;
}
@media (max-width: 640px) {
  .vA .colophon-grid { grid-template-columns: 1fr; gap: 28px; }
}
.vA .colophon h6 {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 10px;
}
.vA .colophon p {
  font-size: 13px; line-height: 1.75; color: #5a5d66;
  margin: 0; text-align: justify;
}
.vA .colophon p b { color: var(--ink); font-weight: 600; }
.vA .colophon-mark {
  margin-top: 40px; padding-top: 20px;
  border-top: 1px solid rgba(26,28,34,0.12);
  display: flex; justify-content: center; gap: 14px;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 11px; letter-spacing: 0.16em;
  color: #8a8c93; text-transform: uppercase;
  flex-wrap: wrap;
}
.vA .colophon-mark span:first-child {
  font-weight: 800; color: var(--ink); letter-spacing: 0.24em;
}
.vA .intro-notice {
  margin: 24px 0 56px;
  padding: 22px 26px;
  border: 1px solid rgba(26,28,34,0.14);
  background: #fbf8f1;
  border-radius: 2px;
  position: relative;
}
.vA .intro-notice::before {
  content: "";
  position: absolute; left: 26px; right: 26px; top: 0;
  height: 2px; background: var(--accent);
}
.vA .intro-notice-label {
  display: block;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}
.vA .intro-notice p {
  margin: 0;
  font-size: 13.5px; line-height: 1.85;
  color: var(--ink-soft);
  text-align: justify;
  word-break: keep-all;
}
@media (min-width: 720px) {
  .vA .intro-notice { padding: 26px 32px; margin: 32px 0 72px; }
  .vA .intro-notice::before { left: 32px; right: 32px; }
  .vA .intro-notice p { font-size: 14px; }
}
.vA .colophon-notice {
  max-width: 640px; margin: 0 auto 36px;
}
.vA .colophon-notice p {
  font-size: 13px; line-height: 1.85; color: #5a5d66;
  margin: 0; text-align: justify;
  word-break: keep-all;
}
.vA .closing-pad {
  font-style: italic;
  line-height: 1.5;
  color: var(--ink);
  quotes: "“" "”";
  text-wrap: balance;
}
.vA .ornament {
  text-align: center;
  margin: 40px 0;
  color: var(--accent);
  letter-spacing: 0.8em;
  font-size: 10px;
}

@media print {
  html, body { background: white; }
  .vA, .vA .page { background: white; box-shadow: none; }
  .vA .prayer { color: #1a1c22; background: white; border: 1px solid #1a2f3a; padding: 24px; margin: 24px 0 0; }
  .vA .prayer .label { color: #1a2f3a; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const C = window.SELAH;

function Selah() {
  return (
    <div className="vA">
      <div className="page">
        <header className="masthead">
          <div className="meta-left">{C.series}</div>
          <div className="meta">{C.date}</div>
        </header>

        <aside className="intro-notice" aria-label="매거진 안내">
          <span className="intro-notice-label">Editor&rsquo;s Note</span>
          <p>이 묵상 노트는 일반 AI의 검색 지식이 아니라, 신뢰할 만한 개혁주의 신학 도서들(칼빈·바빙크·웨스트민스터 신앙고백 등)을 기반으로 한 RAG 시스템으로 작성됩니다. 출처를 확인할 수 있는 책들 위에서 본문을 풀기 때문에, 인터넷에 떠도는 출처 불명의 자료 대신 검증된 신학적 토대 위에서 함께 묵상하실 수 있습니다.</p>
        </aside>

        <section className="hero">
          <h1 className="h1">{C.title}</h1>
          <div className="scripture-cite">{C.scripture}</div>
          <blockquote className="scripture">
            {C.scriptureText.map((t, i) => (
              <p key={i}>
                <span className="v">{18 + i}</span>
                {t.split(" / ").map((seg, j, arr) => (
                  <React.Fragment key={j}>
                    <span className="b">{seg.trim()}</span>
                    {j < arr.length - 1 ? <span className="caesura">·</span> : null}
                  </React.Fragment>
                ))}
              </p>
            ))}
          </blockquote>
          <div className="one-line">
            <span className="label">한 줄 요약</span>
            {C.oneLine}
          </div>
        </section>

        <section className="section">
          <div className="section-num">§ I</div>
          <h3 className="section-title">설교 요약</h3>
          <div className="section-sub">주일 말씀의 흐름</div>
          {C.summary.map((s, i) => (
            <div className="summary-item" key={i}>
              <div className="num">{String(i + 1).padStart(2, "0")}</div>
              <div>
                <h4>{s.h}</h4>
                <p>{s.p}</p>
              </div>
            </div>
          ))}
        </section>

        <div className="ornament">◆ ◆ ◆</div>

        {C.references.map((r, i) => (
          <article className="ref" key={i}>
            <div className="ref-head">
              <span className="ref-tag">{r.tag}</span>
              <span className="ref-kicker">{r.kicker}</span>
            </div>
            <h2>{r.title}</h2>
            {r.lede && <div className="ref-lede">{r.lede}</div>}
            {r.body && (
              <div className="ref-body">
                {r.body.map((p, j) => <p key={j}>{p}</p>)}
              </div>
            )}
            {r.table && (
              <table className="idol">
                <thead>
                  <tr><th>우상</th><th>약속</th><th>대가</th></tr>
                </thead>
                <tbody>
                  {r.table.map((row, j) => (
                    <tr key={j}>
                      <td>{row.idol}</td>
                      <td>{row.promise}</td>
                      <td>{row.cost}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
            {r.foot && <div className="ref-foot">{r.foot}</div>}
            {r.pull && (
              <div className="pull">
                <q>{r.pull}</q>
                {r.pullSrc && <div className="pull-src">{r.pullSrc}</div>}
              </div>
            )}
          </article>
        ))}

        <section className="section">
          <div className="section-num">§ II</div>
          <h3 className="section-title">용어 사전</h3>
          <div className="section-sub">이번 주 본문에 등장한 신학 어휘</div>
          <ul className="glossary">
            {C.glossary.map((g, i) => (
              <li className="gloss-item" key={i}>
                <div className="term">
                  {g.term}
                  <em>{g.en}</em>
                </div>
                <div className="def">{g.def}</div>
              </li>
            ))}
          </ul>
        </section>

        <section className="section">
          <div className="section-num">§ III</div>
          <h3 className="section-title">가족모임 나눔 질문</h3>
          <div className="section-sub">자기 안에 던지고, 함께 나누기 위해</div>
          <ol className="qa">
            {C.questions.map((q, i) => <li key={i}>{q}</li>)}
          </ol>
        </section>

        <section className="section">
          <div className="section-num">§ IV</div>
          <h3 className="section-title">한 주의 실천</h3>
          <div className="section-sub">말씀을 몸으로 살아내기 위해</div>
          <div className="practice">
            {C.practice.map((p, i) => (
              <div className="prac-item" key={i}>
                <div className="prac-day">{p.day}</div>
                <div>
                  <div className="prac-title">{p.title}</div>
                  <div className="prac-body">{p.body}</div>
                </div>
              </div>
            ))}
          </div>
        </section>

        <section className="section">
          <div className="section-num">§ V</div>
          <h3 className="section-title">더 깊이 읽기</h3>
          <div className="section-sub">이번 주 주제를 따라 읽으면 좋은 책들</div>
          <ul className="reading">
            {C.reading.map((r, i) => (
              <li className="read-item" key={i}>
                <div className="read-author">{r.author}</div>
                <div>
                  <div className="read-work">{r.work}</div>
                  <div className="read-note">{r.note}</div>
                </div>
              </li>
            ))}
          </ul>
        </section>

        <div className="closing">
          <q>{C.closing}</q>
        </div>

        <footer className="colophon">
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Selah />);
</script>
</body>
</html>
