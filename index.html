<style>
:root {
  --bg:        #f5f2ec;
  --ink:       #1a1c22;
  --ink-soft:  #34363f;
  --muted:     #6c6e76;
  --line:      #d9d4c7;
  --line-soft: #e7e3d8;
  --accent:    #5a3a1f;   /* deep brown */
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  word-break: keep-all;
}

a { color: inherit; text-decoration: none; }

.page {
  max-width: 680px;
  margin: 0 auto;
  padding: 80px 28px 120px;
}
@media (min-width: 720px) {
  .page { padding: 120px 40px 160px; }
}

/* ───── Wordmark (splash style) ───── */
.wordmark-block {
  text-align: center;
  margin: 0 0 16px;
}
.wordmark-svg {
  width: clamp(280px, 60vw, 540px);
  height: auto;
  display: block;
  margin: 0 auto;
}
.wordmark-caption {
  margin: 26px 0 0;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: clamp(10px, 2.4vw, 12px);
  letter-spacing: 0.6em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: 0.55;
}
@media (min-width: 720px) {
  .wordmark-caption { letter-spacing: 0.7em; }
}

/* ───── Section label ───── */
.section-label {
  font-family: "Noto Serif KR", serif;
  font-style: italic;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.04em;
  margin: 88px 0 6px;
}
@media (min-width: 720px) {
  .section-label { margin-top: 112px; }
}
.section-meta {
  font-family: "Pretendard", sans-serif;
  font-size: 11px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 40px;
}

/* ───── Issue list ───── */
.issues {
  list-style: none;
  padding: 0;
  margin: 0;
  border-top: 1px solid var(--line);
}
.issues li {
  border-bottom: 1px solid var(--line);
}
.issue {
  display: block;
  padding: 28px 0;
  transition: padding-left 220ms ease, color 160ms ease;
}
@media (min-width: 720px) {
  .issue { padding: 36px 0; }
}
.issue:hover,
.issue:focus-visible {
  padding-left: 12px;
  outline: none;
}
.issue:hover .issue-date,
.issue:focus-visible .issue-date {
  color: var(--accent);
}
.issue:hover .issue-title,
.issue:focus-visible .issue-title {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  text-decoration-color: rgba(26, 28, 34, 0.4);
}

.issue-date {
  font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  font-weight: 700;
  font-size: clamp(18px, 4.4vw, 22px);
  line-height: 1.4;
  color: var(--ink);
  letter-spacing: -0.01em;
  transition: color 160ms ease;
}
.issue-title {
  margin-top: 8px;
  font-family: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  font-size: clamp(14px, 3.2vw, 15.5px);
  line-height: 1.65;
  color: var(--muted);
  text-wrap: pretty;
}
.issue-title .ref {
  font-style: italic;
  color: var(--ink-soft);
}
.issue-title .sep {
  margin: 0 8px;
  opacity: 0.5;
}

/* ───── Footer ───── */
.foot {
  margin-top: 96px;
  text-align: center;
  font-family: "Pretendard", sans-serif;
  font-size: 10.5px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.7;
}

@media (max-width: 480px) {
  .issue-title .sep { display: block; margin: 4px 0 0; height: 0; opacity: 0; }
}
</style>
</head>

            font-size="160" font-weight="500" fill="#1a2f3a" letter-spacing="2">Selah</text>
    </svg>
    <div class="wordmark-caption">Weekly Meditation</div>
  </div>

  <div class="section-label">§ Issues</div>
  <div class="section-meta">묵상 노트 · 역순</div>

  <!-- 새 호 추가하는 방법: 아래 <li> 블록을 복사해서 가장 위에 붙여넣고
       날짜, 본문, 부제, href 수정 -->
  <ol class="issues">

    <li>
      <a class="issue" href="20260426.html">
        <div class="issue-date">2026년 4월 26일 주일 오전예배</div>
        <div class="issue-title">
          <span class="ref">이사야 40:18–20</span><span class="sep">·</span>비교불가능한 하나님 ③ — 우상과 나란히 설 수 없는 하나님
        </div>
      </a>
    </li>

  </ol>

</main>
